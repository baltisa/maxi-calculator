<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Макси — Калькулятор сборщика</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Макси Сборка">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    .datetime-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #334155;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .datetime-bar span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .tabs {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-add {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    .btn-add:active {
      background: #0284c7;
      color: #fff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-save {
      background: #16a34a;
    }

    .btn-save:active {
      background: #15803d;
    }

    .user-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .user-name {
      font-weight: 600;
      color: #f8fafc;
      font-size: 0.9rem;
    }

    .logout-link {
      color: #ef4444;
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
    }

    .results {
      margin-top: 16px;
      display: none;
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .res-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .res-row:last-child {
      margin-bottom: 0;
    }

    .res-label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .res-value {
      font-size: 1rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .status-badge {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .status-ok {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-bad {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Календарь */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .cal-day-header {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: bold;
      padding-bottom: 4px;
    }

    .cal-cell {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 4px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
    }

    .cal-cell.empty {
      background: transparent;
      border: none;
    }

    .cal-cell.ok {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }

    .cal-cell.bad {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .cal-date {
      font-weight: bold;
      color: #cbd5e1;
    }

    .cal-info {
      font-size: 0.65rem;
      color: #38bdf8;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <div class="datetime-bar">
      <span>📅 <span id="currentDate">-- --- ----</span></span>
      <span>🕒 <span id="currentTime">--:--</span></span>
    </div>

    <div id="authScreen">
      <div class="header">
        <h1>Доставка «Макси»</h1>
        <p>Вход для сборщиков заказов</p>
      </div>
      <form id="authForm">
        <div class="form-group">
          <label for="fullName">Имя и Фамилия</label>
          <input type="text" id="fullName" placeholder="например, Алексей Смирнов" required>
        </div>
        <button type="submit" class="btn">Войти в калькулятор</button>
      </form>
    </div>

    <div id="calcScreen" class="hidden">
      
      <div class="user-banner">
        <div>
          <div style="font-size: 0.75rem; color: #94a3b8;">Сборщик:</div>
          <div class="user-name" id="displayUserName"></div>
        </div>
        <span class="logout-link" onclick="logout()">Сменить</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabDayBtn" onclick="switchTab('day')">Смена (День)</button>
        <button class="tab-btn" id="tabMonthBtn" onclick="switchTab('month')">Итоги месяца</button>
        <button class="tab-btn" id="tabCalBtn" onclick="switchTab('cal')">Календарь</button>
      </div>

      <!-- Вкладка 1: СМЕНА -->
      <div id="dayTab">
        <form id="dayForm">
          <div class="form-group">
            <label for="dayLines">Собрано строк за смену</label>
            <input type="number" id="dayLines" min="0" placeholder="0" value="0">
            <div class="add-row">
              <button type="button" class="btn-add" onclick="addDayLines(5)">+5</button>
              <button type="button" class="btn-add" onclick="addDayLines(10)">+10</button>
              <button type="button" class="btn-add" onclick="addDayLines(20)">+20</button>
              <button type="button" class="btn-add" style="color:#ef4444;" onclick="resetDayLines()">Сброс</button>
            </div>
          </div>

          <div class="form-group">
            <label for="dayHours">Часов отработано за сегодня</label>
            <input type="number" id="dayHours" step="0.1" min="0.1" placeholder="например, 8 или 12">
          </div>

          <button type="submit" class="btn">Рассчитать смену</button>
        </form>

        <div id="dayResults" class="results">
          <div class="res-row">
            <span class="res-label">Скорость за сегодня:</span>
            <span class="res-value" id="dayResSpeed">0 стр/час</span>
          </div>
          <div class="res-row">
            <span class="res-label">Целевая норма:</span>
            <span class="res-value" style="color: #38bdf8;">40.0 стр/час</span>
          </div>
          <div class="res-row">
            <span class="res-label">Разница:</span>
            <span class="res-value" id="dayResDiff">0</span>
          </div>
          <div id="dayStatusBadge" class="status-badge"></div>
          
          <button type="button" class="btn btn-save" onclick="saveShiftToCalendar()">💾 Сохранить смену в календарь</button>
        </div>
      </div>

      <!-- Вкладка 2: ИТОГИ МЕСЯЦА (АВТОМАТИЧЕСКИЕ) -->
      <div id="monthTab" class="hidden">
        <div id="monthResultsBlock" style="background: #0f172a; padding: 16px; border-radius: 12px; border: 1px solid #334155;">
          <div class="res-row">
            <span class="res-label">Отработано дней:</span>
            <span class="res-value" id="mTotalDays">0 дн.</span>
          </div>
          <div class="res-row">
            <span class="res-label">Всего часов:</span>
            <span class="res-value" id="mTotalHours">0 ч</span>
          </div>
          <div class="res-row">
            <span class="res-label">Всего строк:</span>
            <span class="res-value" id="mTotalLines">0 стр</span>
          </div>
          <hr style="border: 0; border-top: 1px solid #334155; margin: 12px 0;">
          <div class="res-row">
            <span class="res-label">Средняя скорость:</span>
            <span class="res-value" id="mAvgSpeed">0 стр/ч</span>
          </div>
          <div class="res-row">
            <span class="res-label">Целевая норма:</span>
            <span class="res-value" style="color: #38bdf8;">40.0 стр/ч</span>
          </div>
          <div class="res-row">
            <span class="res-label">Разница:</span>
            <span class="res-value" id="mDiff">0</span>
          </div>
          <div id="mStatusBadge" class="status-badge"></div>
        </div>
      </div>

      <!-- Вкладка 3: КАЛЕНДАРЬ -->
      <div id="calTab" class="hidden">
        <div style="text-align: center; margin-bottom: 10px; font-weight: bold; color: #38bdf8;" id="calMonthTitle"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

    </div>

  </div>

  <script>
    const TARGET_SPEED = 40.0;
    let currentShiftData = null;

    function updateDateTime() {
      const now = new Date();
      const options = { day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('ru-RU', options);
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('maxi_picker_user');
      if (savedUser) {
        showCalculator(savedUser);
      }
    });

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const userName = document.getElementById('fullName').value.trim();
      if (userName) {
        localStorage.setItem('maxi_picker_user', userName);
        showCalculator(userName);
      }
    });

    function showCalculator(userName) {
      document.getElementById('displayUserName').textContent = userName;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('calcScreen').classList.remove('hidden');
      renderMonthSummary();
      renderCalendar();
    }

    function logout() {
      localStorage.removeItem('maxi_picker_user');
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('calcScreen').classList.add('hidden');
    }

    function switchTab(tab) {
      const dayTab = document.getElementById('dayTab');
      const monthTab = document.getElementById('monthTab');
      const calTab = document.getElementById('calTab');
      
      const tabDayBtn = document.getElementById('tabDayBtn');
      const tabMonthBtn = document.getElementById('tabMonthBtn');
      const tabCalBtn = document.getElementById('tabCalBtn');

      [dayTab, monthTab, calTab].forEach(el => el.classList.add('hidden'));
      [tabDayBtn, tabMonthBtn, tabCalBtn].forEach(el => el.classList.remove('active'));

      if (tab === 'day') {
        dayTab.classList.remove('hidden');
        tabDayBtn.classList.add('active');
      } else if (tab === 'month') {
        renderMonthSummary();
        monthTab.classList.remove('hidden');
        tabMonthBtn.classList.add('active');
      } else if (tab === 'cal') {
        renderCalendar();
        calTab.classList.remove('hidden');
        tabCalBtn.classList.add('active');
      }
    }

    function addDayLines(count) {
      const dayLinesInput = document.getElementById('dayLines');
      let currentVal = parseInt(dayLinesInput.value, 10) || 0;
      dayLinesInput.value = currentVal + count;
    }

    function resetDayLines() {
      document.getElementById('dayLines').value = 0;
    }

    document.getElementById('dayForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const lines = parseInt(document.getElementById('dayLines').value, 10) || 0;
      const hours = parseFloat(document.getElementById('dayHours').value) || 0;

      if (hours > 0) {
        const speed = lines / hours;
        const diff = speed - TARGET_SPEED;

        document.getElementById('dayResSpeed').textContent = `${speed.toFixed(1)} стр/ч`;

        const diffElem = document.getElementById('dayResDiff');
        const badgeElem = document.getElementById('dayStatusBadge');

        if (speed >= TARGET_SPEED) {
          badgeElem.className = 'status-badge status-ok';
          badgeElem.textContent = `Норма за сегодня выполнена!`;
          diffElem.textContent = `+${diff.toFixed(1)} стр/ч`;
          diffElem.style.color = '#4ade80';
        } else {
          badgeElem.className = 'status-badge status-bad';
          const linesNeeded = Math.ceil((TARGET_SPEED * hours) - lines);
          badgeElem.textContent = `Отставание от нормы. Не хватает ${linesNeeded} строк.`;
          diffElem.textContent = `${diff.toFixed(1)} стр/ч`;
          diffElem.style.color = '#f87171';
        }

        currentShiftData = { lines, hours, speed };
        document.getElementById('dayResults').style.display = 'block';
      }
    });

    // СОХРАНЕНИЕ СМЕНЫ В КАЛЕНДАРЬ
    function saveShiftToCalendar() {
      if (!currentShiftData) return;
      
      const today = new Date();
      const dateKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      
      let shifts = JSON.parse(localStorage.getItem('maxi_shifts') || '{}');
      shifts[dateKey] = currentShiftData;
      
      localStorage.setItem('maxi_shifts', JSON.stringify(shifts));
      alert('Смена успешно сохранена в календарь и итоговую статистику!');
    }

    // РАСЧЕТ ИТОГОВ МЕСЯЦА ПО ДАННЫМ ИЗ КАЛЕНДАРЯ
    function renderMonthSummary() {
      const today = new Date();
      const currentYearMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
      const shifts = JSON.parse(localStorage.getItem('maxi_shifts') || '{}');

      let totalHours = 0;
      let totalLines = 0;
      let totalDays = 0;

      for (let key in shifts) {
        if (key.startsWith(currentYearMonth)) {
          totalHours += shifts[key].hours;
          totalLines += shifts[key].lines;
          totalDays++;
        }
      }

      document.getElementById('mTotalDays').textContent = `${totalDays} дн.`;
      document.getElementById('mTotalHours').textContent = `${totalHours.toFixed(1)} ч`;
      document.getElementById('mTotalLines').textContent = `${totalLines} стр`;

      const badgeElem = document.getElementById('mStatusBadge');
      const diffElem = document.getElementById('mDiff');

      if (totalHours > 0) {
        const avgSpeed = totalLines / totalHours;
        const diff = avgSpeed - TARGET_SPEED;

        document.getElementById('mAvgSpeed').textContent = `${avgSpeed.toFixed(1)} стр/ч`;

        if (avgSpeed >= TARGET_SPEED) {
          badgeElem.className = 'status-badge status-ok';
          badgeElem.textContent = `Месячная норма выполняется! Допуск к премии есть.`;
          diffElem.textContent = `+${diff.toFixed(1)} стр/ч`;
          diffElem.style.color = '#4ade80';
        } else {
          badgeElem.className = 'status-badge status-bad';
          const linesNeeded = Math.ceil((TARGET_SPEED * totalHours) - totalLines);
          badgeElem.textContent = `Отставание от месячной нормы. Не хватает ${linesNeeded} строк.`;
          diffElem.textContent = `${diff.toFixed(1)} стр/ч`;
          diffElem.style.color = '#f87171';
        }
      } else {
        document.getElementById('mAvgSpeed').textContent = `0 стр/ч`;
        diffElem.textContent = `0`;
        badgeElem.className = 'status-badge';
        badgeElem.style.background = '#334155';
        badgeElem.style.color = '#94a3b8';
        badgeElem.textContent = `Нет сохраненных смен за этот месяц.`;
      }
    }

    // ОТРИСОВКА КАЛЕНДАРЯ
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();

      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      document.getElementById('calMonthTitle').textContent = `${monthNames[month]} ${year}`;

      const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      daysOfWeek.forEach(day => {
        const header = document.createElement('div');
        header.className = 'cal-day-header';
        header.textContent = day;
        grid.appendChild(header);
      });

      const firstDayOfMonth = new Date(year, month, 1);
      let startingDay = firstDayOfMonth.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();
      const shifts = JSON.parse(localStorage.getItem('maxi_shifts') || '{}');

      for (let i = 0; i < startingDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-cell empty';
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDateOfMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        let cellContent = `<span class="cal-date">${day}</span>`;

        if (shifts[dateKey]) {
          const shift = shifts[dateKey];
          const isOk = shift.speed >= TARGET_SPEED;
          cell.classList.add(isOk ? 'ok' : 'bad');
          cellContent += `<span class="cal-info">${shift.speed.toFixed(1)}/ч<br>${shift.lines}ст</span>`;
        }

        cell.innerHTML = cellContent;
        grid.appendChild(cell);
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
