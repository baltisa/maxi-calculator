<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Макси — Калькулятор сборщика</title>
  
  <!-- PWA настройки -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Макси Сборка">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    .datetime-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #334155;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .datetime-bar span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .tabs {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-add {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    .btn-add:active {
      background: #0284c7;
      color: #fff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn:active {
      background: #0369a1;
    }

    .user-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .user-name {
      font-weight: 600;
      color: #f8fafc;
      font-size: 0.9rem;
    }

    .logout-link {
      color: #ef4444;
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
    }

    .results {
      margin-top: 20px;
      display: none;
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .res-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .res-row:last-child {
      margin-bottom: 0;
    }

    .res-label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .res-value {
      font-size: 1rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .status-badge {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .status-ok {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-bad {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Информационная панель даты и времени -->
    <div class="datetime-bar">
      <span>📅 <span id="currentDate">-- --- ----</span></span>
      <span>🕒 <span id="currentTime">--:--</span></span>
    </div>

    <!-- ЭКРАН 1: АВТОРИЗАЦИЯ -->
    <div id="authScreen">
      <div class="header">
        <h1>Доставка «Макси»</h1>
        <p>Вход для сборщиков заказов</p>
      </div>
      <form id="authForm">
        <div class="form-group">
          <label for="fullName">Имя и Фамилия</label>
          <input type="text" id="fullName" placeholder="например, Алексей Смирнов" required>
        </div>
        <button type="submit" class="btn">Войти в калькулятор</button>
      </form>
    </div>

    <!-- ЭКРАН 2: КАЛЬКУЛЯТОР -->
    <div id="calcScreen" class="hidden">
      
      <div class="user-banner">
        <div>
          <div style="font-size: 0.75rem; color: #94a3b8;">Сборщик:</div>
          <div class="user-name" id="displayUserName"></div>
        </div>
        <span class="logout-link" onclick="logout()">Сменить</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabDayBtn" onclick="switchTab('day')">Смена (День)</button>
        <button class="tab-btn" id="tabMonthBtn" onclick="switchTab('month')">Итоги месяца</button>
      </div>

      <!-- Вкладка 1: СМЕНА -->
      <div id="dayTab">
        <form id="dayForm">
          <div class="form-group">
            <label for="dayLines">Собрано строк за смену</label>
            <input type="number" id="dayLines" min="0" placeholder="0" value="0">
            <div class="add-row">
              <button type="button" class="btn-add" onclick="addDayLines(5)">+5</button>
              <button type="button" class="btn-add" onclick="addDayLines(10)">+10</button>
              <button type="button" class="btn-add" onclick="addDayLines(20)">+20</button>
              <button type="button" class="btn-add" style="color:#ef4444;" onclick="resetDayLines()">Сброс</button>
            </div>
          </div>

          <div class="form-group">
            <label for="dayHours">Часов отработано за сегодня</label>
            <input type="number" id="dayHours" step="0.1" min="0.1" placeholder="например, 8 или 12">
          </div>

          <button type="submit" class="btn">Рассчитать смену</button>
        </form>

        <div id="dayResults" class="results">
          <div class="res-row">
            <span class="res-label">Скорость за сегодня:</span>
            <span class="res-value" id="dayResSpeed">0 стр/час</span>
          </div>
          <div class="res-row">
            <span class="res-label">Целевая норма:</span>
            <span class="res-value" style="color: #38bdf8;">40.0 стр/час</span>
          </div>
          <div class="res-row">
            <span class="res-label">Разница:</span>
            <span class="res-value" id="dayResDiff">0</span>
          </div>
          <div id="dayStatusBadge" class="status-badge"></div>
        </div>
      </div>

      <!-- Вкладка 2: ИТОГИ МЕСЯЦА -->
      <div id="monthTab" class="hidden">
        <form id="monthForm">
          <div class="form-group">
            <label for="monthHours">Всего часов за месяц</label>
            <input type="number" id="monthHours" step="0.1" min="0.1" placeholder="например, 160">
          </div>

          <div class="form-group">
            <label for="monthLines">Всего строк за месяц</label>
            <input type="number" id="monthLines" min="0" placeholder="например, 6400">
          </div>

          <button type="submit" class="btn">Рассчитать месяц</button>
        </form>

        <div id="monthResults" class="results">
          <div class="res-row">
            <span class="res-label">Средняя скорость:</span>
            <span class="res-value" id="monthResSpeed">0 стр/час</span>
          </div>
          <div class="res-row">
            <span class="res-label">Целевая норма:</span>
            <span class="res-value" style="color: #38bdf8;">40.0 стр/час</span>
          </div>
          <div class="res-row">
            <span class="res-label">Разница:</span>
            <span class="res-value" id="monthResDiff">0</span>
          </div>
          <div id="monthStatusBadge" class="status-badge"></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const TARGET_SPEED = 40.0;

    // Обновление даты и времени
    function updateDateTime() {
      const now = new Date();
      const options = { day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('ru-RU', options);
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();

    // Авторизация
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('maxi_picker_user');
      if (savedUser) {
        showCalculator(savedUser);
      }
    });

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const userName = document.getElementById('fullName').value.trim();
      if (userName) {
        localStorage.setItem('maxi_picker_user', userName);
        showCalculator(userName);
      }
    });

    function showCalculator(userName) {
      document.getElementById('displayUserName').textContent = userName;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('calcScreen').classList.remove('hidden');
    }

    function logout() {
      localStorage.removeItem('maxi_picker_user');
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('calcScreen').classList.add('hidden');
    }

    // Переключение вкладок
    function switchTab(tab) {
      const dayTab = document.getElementById('dayTab');
      const monthTab = document.getElementById('monthTab');
      const tabDayBtn = document.getElementById('tabDayBtn');
      const tabMonthBtn = document.getElementById('tabMonthBtn');

      if (tab === 'day') {
        dayTab.classList.remove('hidden');
        monthTab.classList.add('hidden');
        tabDayBtn.classList.add('active');
        tabMonthBtn.classList.remove('active');
      } else {
        monthTab.classList.remove('hidden');
        dayTab.classList.add('hidden');
        tabDayBtn.classList.add('active');
        tabDayBtn.classList.remove('active');
      }
    }

    // Быстрые кнопки добавления строк
    function addDayLines(count) {
      const dayLinesInput = document.getElementById('dayLines');
      let currentVal = parseInt(dayLinesInput.value, 10) || 0;
      dayLinesInput.value = currentVal + count;
    }

    function resetDayLines() {
      document.getElementById('dayLines').value = 0;
    }

    // Расчет дневной смены
    document.getElementById('dayForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const lines = parseInt(document.getElementById('dayLines').value, 10) || 0;
      const hours = parseFloat(document.getElementById('dayHours').value) || 0;

      if (hours > 0) {
        calculateAndDisplay(lines, hours, 'dayResSpeed', 'dayResDiff', 'dayStatusBadge', 'dayResults', 'сегодня');
      }
    });

    // Расчет месяца
    document.getElementById('monthForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const lines = parseInt(document.getElementById('monthLines').value, 10) || 0;
      const hours = parseFloat(document.getElementById('monthHours').value) || 0;

      if (hours > 0) {
        calculateAndDisplay(lines, hours, 'monthResSpeed', 'monthResDiff', 'monthStatusBadge', 'monthResults', 'месяц');
      }
    });

    // Общая функция вычислений
    function calculateAndDisplay(lines, hours, speedId, diffId, badgeId, blockId, periodName) {
      const speed = lines / hours;
      const speedFormatted = speed.toFixed(1);
      const diff = speed - TARGET_SPEED;

      document.getElementById(speedId).textContent = `${speedFormatted} стр/ч`;

      const diffElem = document.getElementById(diffId);
      const badgeElem = document.getElementById(badgeId);

      if (speed >= TARGET_SPEED) {
        badgeElem.className = 'status-badge status-ok';
        badgeElem.textContent = `Норма за ${periodName} выполнена!`;
        diffElem.textContent = `+${diff.toFixed(1)} стр/ч`;
        diffElem.style.color = '#4ade80';
      } else {
        badgeElem.className = 'status-badge status-bad';
        const linesNeeded = Math.ceil((TARGET_SPEED * hours) - lines);
        badgeElem.textContent = `Отставание от нормы. Не хватает ${linesNeeded} строк.`;
        diffElem.textContent = `${diff.toFixed(1)} стр/ч`;
        diffElem.style.color = '#f87171';
      }

      document.getElementById(blockId).style.display = 'block';
    }

    // Регистрация PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
